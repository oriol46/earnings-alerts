name: telegram-inbox

# Revisa los archivos que envías al bot por Telegram (transcripciones de TIKR, etc.) y te responde con el análisis.
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos, todos los días (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:

concurrency: telegram-inbox

permissions:
  contents: write   # para guardar los cambios de la watchlist

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      EARNINGS_DB: inbox.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests anthropic pypdf python-docx beautifulsoup4 lxml

      # Recuerda qué mensajes ya se han procesado
      - uses: actions/cache/restore@v4
        with:
          path: inbox.db
          key: inbox-db-${{ github.run_id }}
          restore-keys: inbox-db-

      - name: Revisar mensajes de Telegram
        run: python earnings_alerts.py --inbox

      - name: Guardar cambios de la watchlist
        run: |
          if [ -n "$(git status --porcelain watchlist.txt)" ]; then
            git config user.name "earnings-alerts-bot"
            git config user.email "earnings-alerts-bot@users.noreply.github.com"
            git add watchlist.txt
            git commit -m "Watchlist actualizada desde Telegram"
            git pull --rebase
            git push
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: inbox.db
          key: inbox-db-${{ github.run_id }}
